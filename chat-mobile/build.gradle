plugins {
    id 'com.android.application'
}

android {
    // Assignment syntax throughout: Gradle 10 removes the space-assignment form
    // ('propName value') for Gradle-generated properties in the Groovy DSL.
    namespace = 'com.e2eechat.mobile'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.e2eechat.mobile"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        // Without this the module falls back to the legacy InstrumentationTestRunner, which cannot
        // execute AndroidJUnit4 tests: the run reports "0 tests" and then "Process crashed".
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
    }
    
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation libs.slf4j.android
    implementation project(':core-shared')
    implementation libs.appcompat
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
