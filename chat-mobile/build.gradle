plugins {
    id 'com.android.application'
}

android {
    // Assignment syntax throughout: Gradle 10 removes the space-assignment form
    // ('propName value') for Gradle-generated properties in the Groovy DSL.
    namespace = 'com.e2eechat.mobile'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.e2eechat.mobile"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        // Without this the module falls back to the legacy InstrumentationTestRunner, which cannot
        // execute AndroidJUnit4 tests: the run reports "0 tests" and then "Process crashed".
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
    }
    
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// The client pins the relay's certificate, so the app cannot open a TLS connection without it. On
// desktop TlsSupport can fall back to reading it from the working tree; on a device there is no
// working tree, so it has to be packaged. Copying at build time keeps it in step with whatever
// scripts/generate-dev-cert.sh produced, and keeps an uncommittable *.p12 out of the sources.
def devCert = rootProject.file('chat-server/src/main/resources/dev-keystore.p12')

tasks.register('copyDevCertificate', Copy) {
    from devCert
    into layout.buildDirectory.dir('generated/devCert')
    onlyIf {
        if (!devCert.exists()) {
            logger.warn('dev-keystore.p12 not found - run scripts/generate-dev-cert.sh. '
                    + 'The app will build but cannot connect to the relay.')
        }
        devCert.exists()
    }
}

android.sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/devCert'))
tasks.named('preBuild') { dependsOn 'copyDevCertificate' }

dependencies {
    implementation libs.slf4j.android
    implementation project(':core-shared')
    implementation libs.appcompat
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
