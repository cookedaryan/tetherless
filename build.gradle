plugins {
    // AGP 8.1.0 declared client module dependencies internally, which Gradle 9.0 removes. The
    // warning came from inside the plugin, not from this build's scripts, so a version bump is
    // the only fix.
    id 'com.android.application' version '8.11.1' apply false
    id "com.github.spotbugs" version "6.0.7" apply false
}

ext {
    // One flag decides both the artifact version and whether TlsSupport will accept the
    // development certificate. See BuildInfo.
    isReleaseBuild = project.hasProperty('releaseBuild')
    appVersion = isReleaseBuild ? '1.0.0' : '1.0.0-SNAPSHOT'
    buildChannel = isReleaseBuild ? 'release' : 'dev'

    // Stamped from the commit rather than the wall clock, so the same commit always produces the
    // same properties file.
    gitCommit = {
        try {
            def p = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
            p.waitForOrKill(5000)
            return p.exitValue() == 0 ? p.text.trim() : 'unknown'
        } catch (Exception ignored) {
            return 'unknown'
        }
    }()
    gitCommitDate = {
        try {
            def p = ['git', 'log', '-1', '--format=%cd', '--date=iso-strict'].execute(null, rootDir)
            p.waitForOrKill(5000)
            return p.exitValue() == 0 ? p.text.trim() : 'unknown'
        } catch (Exception ignored) {
            return 'unknown'
        }
    }()
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    version = rootProject.ext.appVersion
    
    project.apply plugin: 'checkstyle'
    project.checkstyle {
        toolVersion = "10.12.7"
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = false
        maxWarnings = 0
    }
    project.configurations.checkstyle {
        exclude group: 'com.google.collections', module: 'google-collections'
    }

    project.pluginManager.withPlugin('java') {
        project.java {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        project.apply plugin: 'com.github.spotbugs'
        project.spotbugs {
            // 4.8.6 bundles an ASM that cannot read the class files of a current JDK: analysis
            // aborted with "Unsupported class file major version 68" on java/lang/Object itself.
            // Keep this ahead of the JDK the build runs on.
            toolVersion = "4.9.6"
            ignoreFailures = false
            // A real enum instance, not the string 'high': Gradle 10 removes String-to-enum
            // coercion for rich properties. valueOf() is used because Groovy resolves the bare
            // `Confidence.HIGH` here as a nested class rather than the constant.
            reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
            excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
        }
        project.dependencies {
            spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
            compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.6'
        }
    }

    project.tasks.withType(JavaCompile).configureEach {
        if (project.pluginManager.hasPlugin('java')) {
            options.release = 8
        }
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:all"
    }
}

