name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Override gradle.properties for CI
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Generate the development certificate
        run: bash scripts/generate-dev-cert.sh

      - name: Build with Gradle
        run: ./gradlew clean build check --stacktrace

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/test/
            **/build/test-results/**/*.xml
          retention-days: 7

      - name: Publish Build Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: '**/build/reports/'
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Override gradle.properties for CI
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Generate the development certificate
        run: bash scripts/generate-dev-cert.sh

      - name: Build Android App
        run: ./gradlew :chat-mobile:assembleDebug :chat-mobile:testDebugUnitTest --stacktrace

  # INTEG-02. The JVM suite asserts the frozen vectors on every build; this job asserts the same
  # values on a real Android runtime, where the crypto comes from Conscrypt rather than the JDK
  # providers. That difference is the whole point: a divergence shows up here as a mismatch against
  # committed bytes instead of as a handshake that fails roughly one time in 256.
  android-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Override gradle.properties for CI
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Generate the development certificate
        run: bash scripts/generate-dev-cert.sh

      # Nested virtualisation is not available on all runners; this enables KVM where it is.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run protocol vectors on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./gradlew :chat-mobile:connectedDebugAndroidTest --stacktrace

      - name: Publish Android test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-conformance-results
          path: chat-mobile/build/outputs/androidTest-results/**
          retention-days: 7

  # INTEG-01. Boots the relay on an ephemeral port, runs two client cores through a full
  # conversation, and asserts that no plaintext appears in anything the relay routed. Kept out of
  # the `build` job because it opens real sockets and is slower than the unit suite, and given a
  # hard timeout because a harness that hangs is a failure, not something to wait out.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Override gradle.properties for CI
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Generate the development certificate
        run: bash scripts/generate-dev-cert.sh

      - name: Run the end-to-end harness
        run: ./gradlew :chat-desktop:integTest --stacktrace

      - name: Publish harness results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            chat-desktop/build/reports/tests/integTest/
            chat-desktop/build/test-results/integTest/**/*.xml
          retention-days: 7

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
