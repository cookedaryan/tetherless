plugins {
    id 'java'
    id 'application'
}

java {
}

application {
    mainClass = 'com.e2eechat.desktop.Main'
}

run {
    systemProperties System.properties
}

// ---------------------------------------------------------- end-to-end harness
//
// INTEG-01. A source set of its own rather than more unit tests, because these boot a relay, open
// real TLS sockets and run a full conversation through them - too slow to sit in the inner loop,
// and it is worth being able to run the fast suite without them. CI runs it as a separate job.
//
// Declared ahead of the dependency block: the source set is what creates the integTest
// configurations that block then adds to.

sourceSets {
    integTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integTestImplementation.extendsFrom implementation
    integTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation libs.slf4j.api
    implementation libs.logback.classic
    implementation project(':core-shared')
    implementation libs.flatlaf
    implementation libs.sqlite.jdbc
    testImplementation libs.junit

    // The harness boots the real relay in-process, so it needs the server module. This is a
    // test-only dependency: nothing in the shipped client links against chat-server.
    integTestImplementation libs.junit
    integTestImplementation project(':chat-server')
}

tasks.register('integTest', Test) {
    group = 'verification'
    description = 'Runs the end-to-end exchange between two client cores and a live relay.'

    testClassesDirs = sourceSets.integTest.output.classesDirs
    classpath = sourceSets.integTest.runtimeClasspath

    // A harness that hangs is a failure, not a build that waits for a person to notice.
    timeout = java.time.Duration.ofMinutes(5)

    shouldRunAfter tasks.named('test')

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// ---------------------------------------------------------------- packaging
//
// jpackage produces a self-contained application: the user needs no JDK. Two targets, because they
// have different prerequisites - 'app-image' is a runnable directory and always works, while the
// native installer needs the WiX Toolset on Windows and will fail loudly without it.
//
// Both refuse to run without -PreleaseBuild. That is not bureaucracy: the release flag is what
// stamps channel=release into build-info.properties, and that stamp is what stops the packaged
// client from falling back to the development certificate. Shipping a dev-stamped build would hand
// users an app that trusts a certificate whose private key is public.

def jpackageOut = layout.buildDirectory.dir('jpackage')
def appIcon = file('src/main/resources/tetherless.ico')

// jpackage rejects a version that is not strictly numeric on Windows, so SNAPSHOT is trimmed.
def packageVersion = rootProject.ext.appVersion.replaceAll('-.*$', '')

def jpackageExecutable = {
    def home = System.getProperty('java.home')
    def name = org.gradle.internal.os.OperatingSystem.current().isWindows()
            ? 'jpackage.exe' : 'jpackage'
    def candidate = new File(new File(home, 'bin'), name)
    return candidate.isFile() ? candidate.absolutePath : name
}()

def commonJpackageArgs = { String type ->
    def args = [
        '--type', type,
        '--name', 'Tetherless',
        '--app-version', packageVersion,
        '--vendor', 'Tetherless',
        '--description', 'End-to-end encrypted chat',
        '--input', layout.buildDirectory.dir('install/chat-desktop/lib').get().asFile.absolutePath,
        '--main-jar', "chat-desktop-${rootProject.ext.appVersion}.jar".toString(),
        '--main-class', 'com.e2eechat.desktop.Main',
        '--dest', jpackageOut.get().asFile.absolutePath,
    ]
    if (appIcon.isFile()) {
        args += ['--icon', appIcon.absolutePath]
    }
    return args
}

def requireReleaseBuild = {
    if (!rootProject.ext.isReleaseBuild) {
        throw new GradleException(
                'Packaging requires -PreleaseBuild. Without it the artifact is stamped '
                        + 'channel=dev, and TlsSupport would let it fall back to the development '
                        + 'certificate. Run: ./gradlew :chat-desktop:packageAppImage -PreleaseBuild')
    }
}

tasks.register('packageAppImage', Exec) {
    group = 'distribution'
    description = 'Builds a self-contained application directory with jpackage.'
    dependsOn 'installDist'
    doFirst {
        requireReleaseBuild()
        delete(jpackageOut.get().asFile)
        jpackageOut.get().asFile.mkdirs()
    }
    commandLine([jpackageExecutable] + commonJpackageArgs('app-image'))
}

tasks.register('packageInstaller', Exec) {
    group = 'distribution'
    description = 'Builds a native installer (.msi on Windows) with jpackage. Needs WiX on Windows.'
    dependsOn 'installDist'
    doFirst {
        requireReleaseBuild()
        jpackageOut.get().asFile.mkdirs()
    }
    def type = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'msi'
            : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? 'dmg' : 'deb')
    def args = commonJpackageArgs(type)
    if (type == 'msi') {
        // A per-user install needs no administrator, and a shortcut makes it findable.
        args += ['--win-shortcut', '--win-menu', '--win-per-user-install', '--win-dir-chooser']
    }
    commandLine([jpackageExecutable] + args)
}
